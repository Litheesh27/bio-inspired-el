[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bioroute"
version = "0.1.0"
description = "Three-way benchmark of Dijkstra/A*, ACO, and Physarum routing on the Central Bengaluru road network."
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

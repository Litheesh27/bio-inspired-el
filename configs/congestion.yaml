# Phase 2a BPR (Bureau of Public Roads) analytic congestion fallback.
# All numeric parameters for congestion/bpr.py live here -- nothing is
# inlined in code, so tuning the congestion bands never requires a code
# change.

seed: 42

# ---------------------------------------------------------------------------
# PHASE 2D: which free-flow baseline graph every provider references.
# ---------------------------------------------------------------------------
# Before Phase 2d, "free-flow" meant two different things: the graph's
# `travel_time` came from the conservative Bengaluru `speeds_kph` table in
# configs/area_central_blr.yaml, while SUMO derived its own (faster) speeds
# from OSM/netconvert defaults. SUMO *congested* times could therefore come
# out BELOW the graph's *free-flow* times, and "SUMO 1.7x" vs "BPR 1.1x"
# were ratios against different denominators.
#
#   config_speeds -- Phase 1's artifact, data/network/<name>_<hash>.graphml.
#                    Speeds from configs/area_central_blr.yaml. Reproducible
#                    without SUMO; this is what Phases 1-5 measured against.
#   sumo_speeds   -- the Phase 2d re-annotation,
#                    data/network/<name>_<hash>_<baselinehash>_sumospeeds.graphml,
#                    built by scripts/02_run_sumo.py from the speeds in the
#                    generated data/sumo/net.net.xml via the Phase 2c edge-ID
#                    join. Edges with no SUMO match keep their config-derived
#                    speed and are counted in the build report. Use this
#                    whenever SUMO and BPR numbers are reported side by side.
#
# The selector is consumed by network/graph.py's `load_baseline_graph`. The
# chosen baseline is stamped into the graph itself (`G.graph["baseline"]`),
# folded into BOTH providers' snapshot cache keys (so switching baselines
# never reuses a stale snapshot -- the two graphs share an area-config hash),
# and recorded in every `TrafficSnapshot.meta`.
baseline_graph: sumo_speeds

# Capacity (vehicles/hour/lane) by OSM `highway` tag. Bengaluru-plausible
# values: arterials (primary/secondary) carry meaningfully more than
# residential/living_street lanes, which are often narrow, unmarked, and
# shared with parking/pedestrians.
capacity_veh_h_per_lane:
  motorway: 1800
  motorway_link: 1500
  trunk: 1600
  trunk_link: 1300
  primary: 1200
  primary_link: 1000
  secondary: 900
  secondary_link: 800
  tertiary: 700
  tertiary_link: 600
  unclassified: 500
  residential: 400
  living_street: 250
  service: 300
default_capacity_veh_h_per_lane: 500

# OSM `lanes` is sparsely tagged in this study area (see Phase 2a report).
# Default lane count by highway type, used whenever an edge has no usable
# `lanes` tag.
default_lanes_by_highway:
  motorway: 3
  motorway_link: 1
  trunk: 2
  trunk_link: 1
  primary: 2
  primary_link: 1
  secondary: 2
  secondary_link: 1
  tertiary: 1
  tertiary_link: 1
  unclassified: 1
  residential: 1
  living_street: 1
  service: 1
default_lanes: 1

# Standard BPR volume-delay function: t = t0 * (1 + alpha * (v/c)^beta)
bpr:
  alpha: 0.15
  beta: 4.0

# Synthetic OD demand + incremental (approximate user-equilibrium)
# assignment. trips_per_pair_* is the total synthetic trip volume assigned
# to one OD pair over one time-bin's assignment horizon, in the same units
# as edge capacity (veh/h-equivalent); it is a free calibration knob, not a
# measured count -- see Phase 2a report for the values chosen and the
# resulting congestion ratios.
demand:
  # Values below were tuned empirically (see Phase 2a report) against 100
  # random OD pairs on the real cached graph, evaluated at time_bin=1
  # (multiplier 1.0). Light and heavy are TWO INDEPENDENT incremental
  # assignments (see BPRProvider._assign), each run from zero demand to its
  # own total -- not checkpoints of one shared ramp. With these values they
  # land at ~1.12x and ~2.19x free-flow mean path cost respectively, both
  # inside the target bands (1.1-1.3x / 1.8-2.5x). Because the two levels
  # are independently assigned, a small fraction of edges see heavy < light
  # (measured ~0.30% of edges) -- this reflects genuine route-switching
  # under user equilibrium, not a bug; see test_congestion.py.
  n_od_pairs: 400
  trips_per_pair_light: 68
  trips_per_pair_heavy: 190
  n_increments: 10
  time_bins: 4
  # Multiplies trips_per_pair_* per time bin, so congestion is time-varying
  # rather than static across a day (e.g. off-peak / AM peak / midday /
  # PM peak).
  time_bin_multipliers: [0.5, 1.0, 0.7, 1.15]

# Where computed snapshots are cached, keyed by area-config hash +
# congestion-config hash + level + time_bin + seed, so Phases 4-8 don't
# re-run a 10-increment assignment on every process start.
cache_dir: data/results/congestion_cache
